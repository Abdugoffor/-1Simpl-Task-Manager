services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?DB_NAME must be set in .env}
      POSTGRES_USER: ${DB_USER:?DB_USER must be set in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      TZ: ${DB_TIMEZONE:-Asia/Tashkent}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  pgadmin:
    image: dpage/pgadmin4:9.18
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?PGADMIN_PASSWORD must be set in .env}
      PGADMIN_SERVER_JSON_FILE: /tmp/servers.json
      PGADMIN_REPLACE_SERVERS_ON_STARTUP: "True"
      PGPASS_FILE: /tmp/pgpass
      DB_NAME: ${DB_NAME:?DB_NAME must be set in .env}
      DB_USER: ${DB_USER:?DB_USER must be set in .env}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        printf '{"Servers":{"1":{"Name":"Task Manager DB","Group":"Servers","Host":"postgres","Port":5432,"MaintenanceDB":"%s","Username":"%s","SSLMode":"prefer"}}}' "$${DB_NAME}" "$${DB_USER}" > /tmp/servers.json
        printf 'postgres:5432:%s:%s:%s\n' "$${DB_NAME}" "$${DB_USER}" "$${DB_PASSWORD}" > /tmp/pgpass
        chmod 600 /tmp/pgpass
        exec /entrypoint.sh
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  pgadmin_data:
